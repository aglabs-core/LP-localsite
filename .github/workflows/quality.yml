name: Qualidade do LocalSite

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: localsite-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: artifacts/ag-labs
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
      - name: Instalar dependências da landing page
        run: npm ci
      - name: Verificar tipos e compilar
        run: |
          npm exec --no -- tsc --noEmit
          npm run build
      - name: Conferir páginas geradas
        run: |
          test -s dist/index.html
          test -s dist/portfolio/index.html
      - name: Instalar pnpm fixado do workspace
        working-directory: .
        run: npm install --global pnpm@10.34.9
      - name: Instalar workspace reproduzível
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Conferir tipos e builds de todos os pacotes
        working-directory: .
        run: pnpm run build
        env:
          PORT: '5174'
          BASE_PATH: /
